plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.5'
	id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.scalar'
version = '0.9.0'
description = 'ScalarRE samples — Svc1/Svc2 producer & consumer demo app'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenLocal()   // scalar-re-sdk is installed here via `./gradlew publishToMavenLocal`
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// Swagger / OpenAPI UI at /swagger-ui.html
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

	// ScalarRE SDK — build event body JSON / parse inbox body.
	// Install first: (cd ../../scalar-re-sdk && ./gradlew publishToMavenLocal)
	implementation 'com.scalar:scalar-re-sdk:0.9.0'

	// ScalarDB — producer writes the re_outbox row transactionally (COMMITTED,
	// so RE picks it up). The consumer uses plain JDBC (native consume TX).
	implementation 'com.scalar-labs:scalardb:3.17.1'

	// PostgreSQL JDBC driver for the native consume TX + read-side queries.
	runtimeOnly 'org.postgresql:postgresql'

	// Config YAML parsing (SnakeYAML ships with Spring Boot).
	implementation 'org.yaml:snakeyaml'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
